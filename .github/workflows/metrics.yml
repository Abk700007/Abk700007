name: Generate GitHub Stat Cards & Trophies

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      # Step 0: Remove existing files/directories that block SVG creation
      - name: Clean up old SVG artifacts
        run: |
          rm -f "${{ github.workspace }}/github-trophies.svg" "${{ github.workspace }}/github-stats.svg" "${{ github.workspace }}/github-top-langs.svg"

      # 1. Generate Main Stats Card
      - name: Generate Stats Card
        uses: lowlighter/metrics@latest
        with:
          filename: ${{ github.workspace }}/github-stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Abk700007
          template: classic
          base: header, activity, community
          config_timezone: Asia/Kolkata

      # 2. Generate Top Languages Card
      - name: Generate Top Languages Card
        uses: lowlighter/metrics@latest
        with:
          filename: ${{ github.workspace }}/github-top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Abk700007
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

      # 3a. Ensure no conflicting trophy path
      - name: Ensure no conflicting trophy path
        run: |
          # If a directory or tracked path named github-trophies.svg exists, remove it
          if [ -d github-trophies.svg ] || [ -d "${{ github.workspace }}/github-trophies.svg" ]; then
            git rm -r --ignore-unmatch github-trophies.svg || true
            rm -rf github-trophies.svg "${{ github.workspace }}/github-trophies.svg"
          fi
          # Also remove any file just in case
          rm -f github-trophies.svg "${{ github.workspace }}/github-trophies.svg"

      # 3. Generate Trophies Card
      - name: Generate GitHub Trophies
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: Abk700007
          # Write explicitly into the repository workspace to avoid writing into the action's package dir
          output_path: ${{ github.workspace }}/github-trophies.svg
          column: 7
          theme: onedark
          no-frame: true
          token: ${{ secrets.METRICS_TOKEN }}

      # 4. Commit and Push generated SVG files
      - name: Commit & Push Generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only add files that actually exist to avoid git pathspec errors
          files=""
          for f in github-stats.svg github-top-langs.svg github-trophies.svg; do
            # check both workspace and repo-root (some actions write in workspace)
            if [ -f "${{ github.workspace }}/$f" ]; then
              git add "${{ github.workspace }}/$f"
              files="$files $f"
            elif [ -f "$f" ]; then
              git add "$f"
              files="$files $f"
            fi
          done

          if [ -n "$files" ]; then
            git commit -m "fix(metrics): update generated SVGs" || true
            git push
          else
            echo "No generated files to commit"
          fi
