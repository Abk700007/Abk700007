name: Generate GitHub Stat Cards & Trophies

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      # 1. Generate Main Stats Card
      - name: Generate Stats Card
        uses: lowlighter/metrics@latest
        with:
          filename: github-stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Abk700007
          template: classic
          base: header, activity, community
          config_timezone: Asia/Kolkata

      # 2. Generate Top Languages Card
      - name: Generate Top Languages Card
        uses: lowlighter/metrics@latest
        with:
          filename: github-top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Abk700007
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

      # 3. Generate Trophies Card
      - name: Generate GitHub Trophies
        uses: ryo-ma/github-profile-trophy@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: Abk700007
          output_path: github-trophies.svg
          column: 7
          theme: onedark
          no-frame: true

      # 4. Commit and Push generated SVG files
      - name: Commit & Push Generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg github-top-langs.svg github-trophies.svg
          git commit -m "update metrics and trophies svgs" || exit 0
          git push
