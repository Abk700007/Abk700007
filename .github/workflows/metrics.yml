name: Generate GitHub Stat Cards & Trophies

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      # 1. Generate Main Stats Card (Anurag Hazra Style)
      - name: Generate Stats Card
        run: |
          curl -f -s "https://github-stats-extended.vercel.app/api?username=Abk700007&show_icons=true&theme=dark" -o github-stats.tmp.svg && mv github-stats.tmp.svg github-stats.svg || echo "Failed to fetch stats card"

      # 2. Generate Top Languages Card (Anurag Hazra Style)
      - name: Generate Top Languages Card
        run: |
          curl -f -s "https://github-stats-extended.vercel.app/api/top-langs/?username=Abk700007&layout=compact&theme=dark" -o github-top-langs.tmp.svg && mv github-top-langs.tmp.svg github-top-langs.svg || echo "Failed to fetch top languages card"

      # 2b. Generate Streak Stats Card (Local Action using your token)
      - name: Generate Streak Stats Card
        uses: be-next/github-streak-stats-action@v1
        with:
          username: Abk700007
          token: ${{ secrets.METRICS_TOKEN }}
          output-path: ./github-streak.svg
          theme: dark

      # 3a. Ensure no conflicting trophy path
      - name: Ensure no conflicting trophy path
        run: |
          # If a directory or tracked path named github-trophies.svg exists, remove it
          if [ -d github-trophies.svg ]; then
            git rm -r --ignore-unmatch github-trophies.svg || true
            rm -rf github-trophies.svg
          fi
          # Also remove any file just in case
          rm -f github-trophies.svg

      # 3. Generate Trophies Card
      - name: Generate GitHub Trophies
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: Abk700007
          output_path: ./github-trophies.svg
          column: 7
          theme: onedark
          no-frame: true
          token: ${{ secrets.METRICS_TOKEN }}

      # 4. Commit and Push generated SVG files
      - name: Commit & Push Generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only add files that actually exist to avoid git pathspec errors
          files=""
          for f in github-stats.svg github-top-langs.svg github-streak.svg github-trophies.svg; do
            if [ -f "$f" ]; then
              git add "$f"
              files="$files $f"
            fi
          done

          if [ -n "$files" ]; then
            git commit -m "fix(metrics): update generated SVGs" || true
            git push
          else
            echo "No generated files to commit"
          fi
